# Tjenester for lokal utvikling: MySQL, Redis og Ollama.
# Appen kjøres lokalt med «php artisan serve» og «php artisan horizon».
#
#   docker compose up -d
#   docker compose exec ollama ollama pull bge-m3
#   docker compose exec ollama ollama pull gemma3:27b
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hvamenerpartiet
      MYSQL_USER: hvamenerpartiet
      MYSQL_PASSWORD: hemmelig
      MYSQL_ROOT_PASSWORD: hemmelig
    ports:
      - "3306:3306"
    volumes:
      - mysql:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    # Fjern kommentarene for GPU (krever NVIDIA Container Toolkit).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  mysql:
  ollama:
