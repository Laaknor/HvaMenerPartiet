name: Tester

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: testing
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql]

    name: PHP 8.3 (${{ matrix.db }})

    steps:
      - name: Hent koden
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer poppler (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Sett opp PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql, intl, redis
          coverage: none

      - name: Installer Composer-avhengigheter
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Kopier miljøfil og lag nøkkel
        run: cp .env.example .env && php artisan key:generate

      - name: Kodestil (Pint)
        if: matrix.db == 'sqlite'
        run: vendor/bin/pint --test

      - name: Kjør tester (SQLite)
        if: matrix.db == 'sqlite'
        run: php artisan test

      - name: Kjør tester (MySQL)
        if: matrix.db == 'mysql'
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: root
